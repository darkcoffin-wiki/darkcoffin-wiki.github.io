name: 自检（可选）

# 说明：本站采用「本地构建 + 提交 docs/ + Pages 从 main 分支的 /docs 发布」的方式，
# 因此**不需要** Actions 来发布。这个工作流只是每次推送时帮你跑一遍自检，
# 确认词表/标签/站点没有坏掉。若你不想用，删掉 .github/ 整个目录即可。
#
# 若你更希望改成「Actions 自动构建发布」，告诉我，我把发布版 workflow 补上
# （那需要同时把 .gitignore 里的 docs/ 重新注释掉）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 打标签（应为确定性重建）
        run: python tools/tag_entries.py

      - name: 重建站点
        run: python tools/build_site.py

      - name: 站点自检（页面齐全 / 无死链）
        run: python tools/check_site.py

      - name: 子分类校验
        run: python tools/check_subcategories.py

      - name: 打标自检（只报告，不失败）
        run: python tools/tag_audit.py
        continue-on-error: true

      - name: 确认重建后与提交内容一致
        run: |
          if ! git diff --quiet; then
            echo "::warning::重建结果与提交的 docs/ 不一致，请本地跑一次 build_site.py 再提交"
            git diff --stat
          fi
